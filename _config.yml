# Theme Settings [关键：开启远程模式]
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default" 

# Site Settings
locale: "zh-CN" # [修改项] 改为中文
title: "CheeseKitty's Blog"
name: "CheeseKitty"
description: "Thinking slowly about fast AI."
url: "https://blog.cheesekitty.top" # [修改项] 填入你的域名
baseurl: ""
repository: "imeixi/imeixi.github.io" # [修改项] 你的仓库名

# 导航 [关键：开启 Demo 顶栏]
site_navigation: main 

# 搜索 [关键：开启 Demo 搜索]
search: true
search_full_content: true
search_provider: lunr

# Site Author [修改项：侧边栏信息]
author:
  name: "CheeseKitty"
  avatar: "/assets/images/avatar.jpg" # 请确保图片存在
  bio: "Developer & Creator"
  # location: "China"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/imeixi"

# Plugins [关键：远程模式必须包含 remote-theme 插件]
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme # [必须手动添加这一行]

# 添加此段以解决 404 问题
include:
  - _pages

custom_css:
  - assets/css/custom.css

# Defaults (保持 Demo 设置)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
